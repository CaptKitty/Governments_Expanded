 ## Events
 GE_Mechanic_Events.1.T: "Internal Agenda"
 GE_Mechanic_Events.1.D: "The din of debating MPs swirled around [Root.Monarch.GetName], the Prime Minister attempting in vain to quell the hubbub, his cries of “Ordnung!” going unheeded by the predominantly French-speaking gathering and simply adding to the chaos. Finally, the [Root.Monarch.GetTitle] had enough. “Silence! Stilte! Stille!” The rarity of this behavior quickly awed the gathering into quiet. “With the indulgence given that we are still yet a new country, gentlemen, if we are to succeed as one we must conduct our affairs with respect and order. Now, shall we begin again?” The MPs nodded in acquiescence. In order to efficiently manage a country in a rapidly changing world, it was imperative that a specified council be appointed to handle specific issues facing the nation, rather than leaving the management to… whatever this motley gathering could be called. Which council would best suit the needs of the state?"
 GE_Mechanic_Events.1.OPT1: "We must check our books"
 GE_Mechanic_Events.1.OPT2: "New workers for the country"
 GE_Mechanic_Events.1.OPT3: "Let us build more!"

 GE_Mechanic_Events.2.T: "Foreign Policy Discussions"
 GE_Mechanic_Events.2.D: "The quiet clinks of porcelain and silverware contrasted greatly with the organized chaos of the Parliament chambers. For today, separated from the game of politics, the leaders of the realm, the monarch and the Prime Minister, would decide the nation's diplomatic situation. Chosen from the monarch's favored party in Parliament, yet vested with authority counterbalancing royal power, the Prime Minister was keenly aware of the importance of both their positions. Despite being a political ally of the ruler, he himself felt the slight tension in the room as both positions routinely jockeyed for influence in the government, each balancing and containing the other in a delicate dance. Over hot chocolate and refreshments, the opulence of the palace parlor belied the seriousness of today's conversation. It was clear that, in order to avoid personal tension and still run things efficiently, the [Root.Monarch.GetTitle] and the Prime Minister would have to agree on which ministry to emphasize. Which should it be?"
 GE_Mechanic_Events.2.OPT1: "Entrust new Diplomats"
 GE_Mechanic_Events.2.OPT2: "Trade must flow!"
 GE_Mechanic_Events.2.OPT3: "Invest in the colonial territories"

 GE_Mechanic_Events.3.T: "Council of War"
 GE_Mechanic_Events.3.D: "One after another, the lords and high ministers of the realm pulled up to Coudenberg Palace. Some young and more gallant nobles rode in on their own horses, decorative swords at their side, to be surrendered prior to being in the same room as the king, of course. Other more experienced wise members of the parliament or general staff arrived in carriages. One by one, the lords and ministers of war gathered. The lords, still with great landholdings and martial experience, honored their ancient duties to the realm in assisting the king in matters of war. The ministers, heralding a new age of national armies and centralized reform, complemented the nobles by creating a more efficient and effective system. On the agenda today? A new council is to be convened of the gathered dignitaries. This council, though temporary, would be vital for the near future of the state, as its focus will determine what the military's strengths and weaknesses are in the coming conflicts."
 GE_Mechanic_Events.3.OPT1: "Enlist new engineers!"
 GE_Mechanic_Events.3.OPT2: "Assemble the army"
 GE_Mechanic_Events.3.OPT3: "Hoist the colours!"

