l_english:
# Tier 
 ge_ancien_regime_reform: "Ancien Regime"
 ge_ancien_regime_reform_desc: "The administration of France has become increasingly corrupt under the current Ancien Régime. It is in the states interest to implement an intendancy system to centralize our realm and to root out the influence of those who are not loyal to the crown."
 ge_dukes_of_brittany_reform: "Dukes of Brittany"
 ge_dukes_of_brittany_reform_desc: "The Breton dukes forged a realm of war, legend, and maritime ambition. Their armies, clad entirely in black and striking under the cover of night, became feared raiders whose sudden assaults shattered enemy morale, while Breton poets gathered the ancient tales of Arthur, Merlin, the Lady of the Lake, and Gawain into a shared national memory and a proud claim to the noble kings of old. Seeking to preserve their independence amid the devastation of the Hundred Years' War, they cultivated a sophisticated diplomatic corps and careful alliances, maintaining neutrality while preserving their own freedom. Yet Brittany was never content to remain merely defensive: its sailors and explorers ranged the North Atlantic in search of rich fisheries and whaling grounds, and its people, heirs to a maritime tradition stretching back to Roman times, saw the sea not as a boundary but as their destiny. Their cultural achievements, from the first Breton dictionary to the trilingual scholarship that connected Breton speakers to the wider world, reinforced a realm whose strength lay in both steel and story."
 ge_french_absolutism_reform: "Royaume du Soleil"
 ge_french_absolutism_reform_desc: "God's mandate dictates that we cannot be constrained by the needs of the estates and no one but God may judge us. By the Grace of God we must bring France to new heights and step forward."
 ge_french_feudalism_reform: "French Feudalism"
 ge_french_feudalism_reform_desc: "Since the days of Charlemagne, our nation has practiced a loose form of feudalism, a system where nobles reign over vast swathes of land, in return for service as heavy cavalry during times of war."

# Tier 2
 ge_blood_tax_reform_reform: "Blood Tax"
 ge_blood_tax_reform_reform_desc: "The Nobility is a special class, with special privileges and special responsibilities. Chief among these is the blood tax, where the nobility pays their taxes not in money or goods, but in the form of soldiers, knights and generals. No gold for the treasury or grain for the granary, but blood ready to be spilled."
 ge_noble_court_attendance_reform: "Noble Court Attendance"
 ge_noble_court_attendance_reform_desc: "By forcing the nobility to attent our flamboyant court they have to choose between losing face and failing to meet the extravagant lifestyle expected by our royal society or face bankruptcy and lower personal funds to start plots and rebellions."
 ge_noblesse_d_epee_reform: "Noblesse d'epee"
 ge_noblesse_d_epee_reform_desc: "As with officer of the sword, the expression \"noble of the sword\" derives from the right of such noblemen to bear a sword, which reflected their duty of knightly service to their feudal overlord. In later centuries, a nobleman of the sword was not recognized as such unless his family had held this status for at least four generations. The Nobles of the Sword also provided non-military services to the king, holding positions in all branches of government."


# Tier 3
 ge_abolish_local_parliaments_reform: "Abolish Local Parliaments"
 ge_abolish_local_parliaments_reform_desc: "Some of the local parliaments refuse our new taxes and levies. They claim that taxes are only legal if they are made by the agreement of the monarch and the people.  Do they not know that the king represents the people? let us abolish the parliaments for being obsolete as the people already are represented."
 ge_abolish_the_patronage_system_reform: "Abolish the Patronage System"
 ge_abolish_the_patronage_system_reform_desc: "By abolishing the Patronage System we are no longer bound to the nobility for the recruitment of our heavy knights, and we no longer have to pay the noble pensions that are sucking us dry. Now we can look to the truly talented to serve in the role of mounted skirmishers and shock cavalry."
 ge_compagnies_dordonnance_reform: "Compagnies D'Ordonnance"
 ge_compagnies_dordonnance_reform_desc: "By ordering the creation of a new army based around a modern system of organization, a 'compagnie d'ordonnance', a company of the order. These compagnies were created around the bravest and strongest members of the french temporary armies. The 15 compagnies were composed of approximately 100 'spears', with each 'spear' containing 1 cavalryman, 3 light infantry, 1 heavy infantry and 1 page. Unlike the feudal armies these compagnies guarenteed the royal army to have at least 7500 trained and skilled soldiers at its disposal."
 ge_generalites_reform: "Generalites"
 ge_generalites_reform_desc: "New divisions were created in an attempt to reform the old feudal system. The general recettes , commonly known as généralités (\"generalities\"), and supervised at the beginning by receveurs royaux (\"royal collectors\"), were initially fiscal districts. The first sixteen were created in 1542 by an edict of Henry II . Their functions increased, until in the middle of the 17th century the general committees were under the authority of a regional governor."
 ge_independent_vassals_reform: "Independent Vassals"
 ge_independent_vassals_reform_desc: "Our initial attempts at levying taxes in our vassals has been twarted by local lords and their privileges. By letting the local lords levy our taxes themselves and then passing it along to us we guarentee their rights and loyalty, in addition to recieving the taxes we so desperately need."
 ge_royal_training_reform: "Royal Training"
 ge_royal_training_reform_desc: "The Captains of the army have long controlled the recruitment, equipment and training of our armed forced. Let us do this directly so our forces will never lack in training equipment, manpower or adequate weaponry."

# Tier 4
 ge_corps_diplomatique_reform: "Corps Diplomatique"
 ge_corps_diplomatique_reform_desc: "There is no language for more noble and cultured than French. This is why ambassadors, heralds, and diplomats all around Europe don't use their own language to communicate, but ours instead. Let us establish a Diplomatic Corps that can capitalize on the lingua franca , and send skilled diplomats to every court that seeks our attention."
 ge_parisian_court_reform: "Parisian Court"
 ge_parisian_court_reform_desc: "Let us fill our court with the best france has to offer. proper Parisians, and let the rural farmers and backwards lords stay home in their dwellings. Its a matter of prestige to have everyone at court observe the proper manners and speak in a flawless accent."


# Tier 5
 ge_bourgeoisie_aristocracy_reform: "Bourgeoisie Aristocracy"
 ge_bourgeoisie_aristocracy_reform_desc: "In the wake of the Hundred Years War and the great plague that followed, many noble estates fell into decline or died out, many others were pawned or sold to the rising bourgeoisie aristocracy, who are eager to expand their influence with noble titles rather then just with personal fortunes."
 ge_conseil_souverain_reform: "Conseil Souverain"
 ge_conseil_souverain_reform_desc: "Let us focus on trading and supplying the natives in the regions, why bother setting up expensive plantations with the immorality of slavery while we can just trade with the natives in order to aquire all the exotic goods we need."
 ge_continental_system_reform: "Continental System"
 ge_continental_system_reform_desc: "In order to centralize the economic power of the continent, we need to unite and stop our rival's hold on his trade and through a continent wide system of embargos bleed it dry."
 ge_society_of_agriculture_reform: "Society of Agriculture and an Agricultural Committee"
 ge_society_of_agriculture_reform_desc: "Louis's controller of finances, Henri Bertin, created a new Society of Agriculture and an Agricultural Committee within the government, comparable to those existing to support commerce. In May 1763, Bertin issued a decree permitting the tax-free circulation of grain without taxes. In August 1764, Bertin permitted the export of grain from twenty-seven French ports, later expanded to thirty-six. At the same time he established a large zone around Paris, where grain was reserved exclusively for feeding the Parisians, and established a cap on the grain price, which, if it was passed, would cause the exports to cease. The policy of freeing grain prices was effective in good years, and resulted in increased trade and lower prices."
 ge_weak_burghers_reform: "Subservient Bourgeois"
 ge_weak_burghers_reform_desc: "The constant state of warfare in the kingdom during its earlier days led to many a city, caravan or field being plundered and ravaged. We can use the threat of reduced security to convince the burghers additional taxes are neccesary."

# Tier 6
 ge_droit_divine_reform: "Droit Divin"
 ge_droit_divine_reform_desc: "We have had our right to rule determined through salic law and justified through the clerical declarations, this will no longer do, our right to rule comes not from the church, but from God Himself."


